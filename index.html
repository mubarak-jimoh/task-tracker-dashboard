<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Task Tracker Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Task Tracker Dashboard</h1>
  </header>

  <main>
    <section id="new-task">
      <input id="task-input" type="text" placeholder="Enter a new task..." aria-label="New task">
      <button id="add-btn">Add</button>
    </section>

    <section id="stats">
      <p><strong>Total tasks:</strong> <span id="total">0</span></p>
      <p><strong>Completed:</strong> <span id="completed">0</span></p>
    </section>

    <section id="filters" aria-label="Filter tasks">
      <button class="filter-btn active" data-filter="all" aria-pressed="true">All</button>
      <button class="filter-btn" data-filter="active" aria-pressed="false">Active</button>
      <button class="filter-btn" data-filter="completed" aria-pressed="false">Completed</button>
      <button id="clear-completed" hidden>Clear completed</button>
    </section>

    <ul id="task-list"></ul>
    <p id="empty-message" hidden></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
